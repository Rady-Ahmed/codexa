<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#6C4CF1"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6C4CF1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#6C4CF1" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="#09090b"/>
  <circle cx="256" cy="256" r="220" fill="url(#glow)"/>

  <!-- Border Ring -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="url(#brandGrad)" stroke-width="4" stroke-opacity="0.4"/>

  <!-- Glowing Emblem Center -->
  <g filter="url(#shadow)" transform="translate(256, 256)">
    <!-- Code Bracket Left < -->
    <path d="M -70 -80 L -150 0 L -70 80" fill="none" stroke="url(#brandGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Slash / -->
    <path d="M 30 -110 L -30 110" fill="none" stroke="#22D3EE" stroke-width="28" stroke-linecap="round" stroke-opacity="0.8"/>

    <!-- Code Bracket Right > -->
    <path d="M 70 -80 L 150 0 L 70 80" fill="none" stroke="url(#brandGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
